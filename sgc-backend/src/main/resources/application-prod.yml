# =====================================================
# SGC - Configuração de Produção (prod)
# =====================================================

spring:
  # DataSource (SQL Server)
  datasource:
    url: ${DB_URL:jdbc:sqlserver://production-server:1433;databaseName=SGC_Compliance;encrypt=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # NUNCA usar create/update em produção
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway
  flyway:
    locations: classpath:db/migration

# Server
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/json,application/javascript
  http2:
    enabled: true

# Logging
logging:
  level:
    root: WARN
    com.compliance.sgc: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/sgc/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# API Documentation (desabilitado em produção por segurança)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# CORS (apenas domínio de produção)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://sgc.dominio.com.br}

# JWT (OBRIGATÓRIO: Use variáveis de ambiente em produção!)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000} # 1 hora em produção
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 dias

# File Upload (usar volume/NAS em produção)
file:
  upload:
    directory: ${FILE_UPLOAD_DIR:/mnt/sgc/uploads}
    max-file-size: ${FILE_MAX_SIZE:10485760}

# Actuator (monitoramento)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
